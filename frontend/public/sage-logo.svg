<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="sageLeafGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4E7A60" />
      <stop offset="50%" stop-color="#2D4D3B" />
      <stop offset="100%" stop-color="#1B3024" />
    </linearGradient>
    <linearGradient id="sageAccentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8EB39D" />
      <stop offset="60%" stop-color="#A7C7B3" />
      <stop offset="100%" stop-color="#D6E6DC" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#3A604B" />
      <stop offset="50%" stop-color="#6AA180" />
      <stop offset="100%" stop-color="#B2DAC0" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1B3024" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Soft Sage Medallion -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#E2ECE5" stroke="#8EB39D" stroke-width="2.5" />

  <!-- SAGE Emblem: Intertwined Socratic Torch + Wisdom Leaf ('S' Flow) -->
  <g filter="url(#subtleGlow)" transform="translate(10, 10)">
    <!-- Primary Outer Leaf (Sweeping S-curve silhouette) -->
    <path
      d="M50 14 C32 14, 18 30, 20 54 C21 68, 29 80, 42 84 C48 86, 52 86, 58 84 C71 80, 79 68, 80 54 C82 30, 68 14, 50 14 Z"
      fill="url(#sageLeafGrad)"
    />

    <!-- Inner S-Contour Leaf Vein & Socratic Flame Motif -->
    <!-- Left Flank of S: Nurturing leaf fold -->
    <path
      d="M50 18 C36 28, 28 44, 30 60 C31 70, 38 78, 48 81 C44 75, 42 66, 43 56 C44 44, 49 32, 50 18 Z"
      fill="url(#sageAccentGrad)"
      opacity="0.9"
    />

    <!-- Central Socratic Torch / Inner Guiding Flame -->
    <path
      d="M50 24 C53 34, 58 40, 61 48 C64 56, 62 66, 56 72 C53 75, 49 77, 46 78 C52 76, 57 71, 58 64 C59 56, 55 50, 52 42 C50 36, 49 30, 50 24 Z"
      fill="url(#flameGrad)"
    />

    <!-- Top Beacon Spark of Insight (Radiant Star Node) -->
    <circle cx="50" cy="19" r="3.5" fill="#FFFFFF" stroke="#2D4D3B" stroke-width="1.2" />
    
    <!-- Central Wisdom Node -->
    <circle cx="50" cy="46" r="2" fill="#D6E6DC" />
  </g>
</svg>